<!-- @dsCard group="Spacing" viewport="700x160" name="Elevation" subtitle="Soft, single-layer, cool-toned shadows." -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 28px 24px; background: var(--surface-page); font-family: var(--font-body); }
  .row { display: flex; gap: 26px; }
  .u { text-align: center; }
  .box { width: 120px; height: 74px; background: var(--surface-card); border: 1px solid var(--border-subtle); border-radius: var(--radius-md); }
  .n { font-size: 11px; color: var(--text-muted); margin-top: 10px; }
</style>
</head>
<body>
  <div class="row">
    <div class="u"><div class="box" style="box-shadow:var(--shadow-xs)"></div><div class="n">xs</div></div>
    <div class="u"><div class="box" style="box-shadow:var(--shadow-sm)"></div><div class="n">sm</div></div>
    <div class="u"><div class="box" style="box-shadow:var(--shadow-md)"></div><div class="n">md</div></div>
    <div class="u"><div class="box" style="box-shadow:var(--shadow-lg)"></div><div class="n">lg</div></div>
  </div>
</body>
</html>
