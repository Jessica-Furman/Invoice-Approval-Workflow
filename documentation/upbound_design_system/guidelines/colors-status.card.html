<!-- @dsCard group="Colors" viewport="700x120" name="Status colors" subtitle="Restrained, brand-temperate feedback hues." -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 20px; background: var(--surface-page); font-family: var(--font-body); }
  .row { display: flex; gap: 14px; }
  .sw { flex: 1; display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: var(--radius-sm); background: var(--surface-card); border: 1px solid var(--border-subtle); }
  .dot { width: 18px; height: 18px; border-radius: var(--radius-dot); }
  .name { font-size: 13px; font-weight: 600; color: var(--text-strong); }
  .hex { font-size: 11px; color: var(--text-muted); }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><span class="dot" style="background:#3E9B4F"></span><div><div class="name">Success</div><div class="hex">#3E9B4F</div></div></div>
    <div class="sw"><span class="dot" style="background:#C98A16"></span><div><div class="name">Warning</div><div class="hex">#C98A16</div></div></div>
    <div class="sw"><span class="dot" style="background:#C6453B"></span><div><div class="name">Danger</div><div class="hex">#C6453B</div></div></div>
    <div class="sw"><span class="dot" style="background:#3E6FB0"></span><div><div class="name">Info</div><div class="hex">#3E6FB0</div></div></div>
  </div>
</body>
</html>
