<!-- @dsCard group="Colors" viewport="700x150" name="Dark foundation" subtitle="The 60% — navy, near black, charcoal surfaces." -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 20px; background: var(--surface-page); }
  .row { display: flex; gap: 14px; }
  .sw { flex: 1; border-radius: var(--radius-md); overflow: hidden; border: 1px solid var(--border-subtle); background: var(--surface-card); }
  .chip { height: 66px; }
  .meta { padding: 8px 12px; font-family: var(--font-body); }
  .name { font-size: 13px; font-weight: 600; color: var(--text-strong); }
  .hex { font-size: 12px; color: var(--text-muted); font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:#35323D"></div><div class="meta"><div class="name">Deep Navy</div><div class="hex">#35323D</div></div></div>
    <div class="sw"><div class="chip" style="background:#1A1A1A"></div><div class="meta"><div class="name">Near Black</div><div class="hex">#1A1A1A</div></div></div>
    <div class="sw"><div class="chip" style="background:#3A3A3B"></div><div class="meta"><div class="name">Charcoal</div><div class="hex">#3A3A3B</div></div></div>
  </div>
</body>
</html>
