<!-- @dsCard group="Brand" viewport="700x170" name="Wordmark & sub-brand lockup" subtitle="Type stand-in — no logo artwork supplied." -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 0; background: var(--up-navy); font-family: var(--font-body); display: flex; height: 170px; }
  .cell { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }
  .cell + .cell { border-left: 1px solid var(--divider-on-dark); }
  .wm { font-family: var(--font-display); font-weight: 600; font-size: 30px; color: var(--up-off-white); letter-spacing: -0.01em; }
  .wm .dot { color: var(--up-green); }
  .desc { font-size: 11px; font-weight: 700; letter-spacing: 0.28em; text-transform: uppercase; color: var(--up-green); margin-top: 2px; }
  .note { position: absolute; bottom: 8px; left: 0; right: 0; text-align: center; font-size: 10px; color: var(--up-cool-grey); }
</style>
</head>
<body>
  <div class="cell">
    <div class="wm">upbound<span class="dot">.</span></div>
  </div>
  <div class="cell">
    <div class="wm">upbound</div>
    <div class="desc">Digital</div>
  </div>
  <div class="note">Type stand-in in Poppins — replace with official wordmark files</div>
</body>
</html>
