<!-- @dsCard group="Type" viewport="700x120" name="Labels & eyebrows" subtitle="Inter Bold · all caps · tracked." -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 24px; background: var(--surface-card); font-family: var(--font-body); display: flex; gap: 40px; align-items: center; flex-wrap: wrap; }
  .lbl { font-size: 12px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-strong); }
  .lbl.green-ctx { color: var(--up-green); background: var(--up-navy); padding: 6px 12px; border-radius: var(--radius-xs); }
  .tag { font-size: 11px; color: var(--text-muted); }
</style>
</head>
<body>
  <span class="lbl">Financial opportunity</span>
  <span class="lbl green-ctx">Investors ·</span>
  <span class="tag">letter-spacing 0.12em</span>
</body>
</html>
