<!-- @dsCard group="Type" viewport="700x200" name="Display & headings — Poppins" subtitle="Geometric sans. Headlines, display, subheads." -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 24px; background: var(--surface-card); }
  .stack { display: flex; flex-direction: column; gap: 10px; }
  .d { font-family: var(--font-display); color: var(--text-strong); margin: 0; }
  .h1 { font-size: 48px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.05; }
  .h2 { font-size: 30px; font-weight: 600; letter-spacing: -0.01em; }
  .h3 { font-size: 21px; font-weight: 500; }
  .tag { font-family: var(--font-body); font-size: 11px; color: var(--text-muted); }
</style>
</head>
<body>
  <div class="stack">
    <div class="d h1">Move upward.</div>
    <div class="d h2">Heading / H2 · Semibold</div>
    <div class="d h3">Subhead / H3 · Medium</div>
    <div class="tag">Poppins · 700 / 600 / 500 · sentence case · tight leading</div>
  </div>
</body>
</html>
