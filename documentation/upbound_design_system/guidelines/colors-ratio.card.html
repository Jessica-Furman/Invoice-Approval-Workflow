<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 20px; background: var(--surface-page); font-family: var(--font-body); }
  .panel { position: relative; height: 128px; border-radius: var(--radius-lg); background: var(--up-navy); overflow: hidden; padding: 22px 24px; box-sizing: border-box; color: var(--up-off-white); }
  .eyebrow { font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--up-cool-grey); }
  .head { font-family: var(--font-display); font-weight: 700; font-size: 22px; margin-top: 6px; max-width: 60%; line-height: 1.15; }
  .cta { position: absolute; right: 24px; bottom: 22px; background: var(--up-green); color: var(--up-near-black); font-weight: 600; font-size: 14px; padding: 10px 18px; border-radius: var(--radius-pill); }
  .wash { position: absolute; inset: 0 -40% 0 55%; background: var(--up-charcoal); transform: skewX(-30deg); transform-origin: bottom left; }
</style>
</head>
<body>
  <div class="panel">
    <div class="wash"></div>
    <div style="position:relative">
      <div class="eyebrow">Financial opportunity</div>
      <div class="head">We help people move their finances forward.</div>
    </div>
    <div class="cta">Get started</div>
  </div>
</body>
</html>
