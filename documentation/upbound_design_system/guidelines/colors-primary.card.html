<!-- @dsCard group="Colors" viewport="700x150" name="Primary — Upbound Green" subtitle="Signature accent. 10% max. Never green text on light." -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 20px; background: var(--surface-page); }
  .row { display: flex; gap: 14px; }
  .sw { flex: 1; border-radius: var(--radius-md); overflow: hidden; border: 1px solid var(--border-subtle); background: var(--surface-card); }
  .chip { height: 66px; }
  .meta { padding: 8px 12px; font-family: var(--font-body); }
  .name { font-size: 13px; font-weight: 600; color: var(--text-strong); }
  .hex { font-size: 12px; color: var(--text-muted); font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:#B3FF33"></div><div class="meta"><div class="name">Upbound Green</div><div class="hex">#B3FF33</div></div></div>
    <div class="sw"><div class="chip" style="background:#A2EB2A"></div><div class="meta"><div class="name">Green Hover</div><div class="hex">#A2EB2A</div></div></div>
    <div class="sw"><div class="chip" style="background:#E9FFC2"></div><div class="meta"><div class="name">Green Soft</div><div class="hex">#E9FFC2</div></div></div>
  </div>
</body>
</html>
