<!-- @dsCard group="Spacing" viewport="700x150" name="Corner radii" subtitle="Approachable, echoing the rounded wordmark." -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 24px; background: var(--surface-card); font-family: var(--font-body); }
  .row { display: flex; gap: 22px; align-items: flex-end; }
  .u { text-align: center; }
  .box { width: 74px; height: 60px; background: var(--up-navy); }
  .n { font-size: 11px; color: var(--text-muted); margin-top: 8px; }
</style>
</head>
<body>
  <div class="row">
    <div class="u"><div class="box" style="border-radius:4px"></div><div class="n">xs · 4</div></div>
    <div class="u"><div class="box" style="border-radius:8px"></div><div class="n">sm · 8</div></div>
    <div class="u"><div class="box" style="border-radius:12px"></div><div class="n">md · 12</div></div>
    <div class="u"><div class="box" style="border-radius:16px"></div><div class="n">lg · 16</div></div>
    <div class="u"><div class="box" style="border-radius:24px"></div><div class="n">xl · 24</div></div>
    <div class="u"><div class="box" style="width:60px;border-radius:999px"></div><div class="n">pill</div></div>
    <div class="u"><div class="box" style="width:60px;border-radius:50%"></div><div class="n">dot</div></div>
  </div>
</body>
</html>
