<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 26px 24px; background: var(--up-navy); font-family: var(--font-body); display: flex; align-items: center; gap: 48px; }
  .stmt { font-family: var(--font-display); font-weight: 600; font-size: 26px; color: var(--up-off-white); }
  .dot-lg { width: 14px; height: 14px; border-radius: 50%; background: var(--up-green); display: inline-block; }
  .bul { color: var(--up-off-white); font-size: 15px; display: grid; gap: 8px; }
  .bul li { display: flex; align-items: center; gap: 10px; list-style: none; }
  .bul .d { width: 8px; height: 8px; border-radius: 50%; background: var(--up-green); flex: none; }
  ul { margin: 0; padding: 0; }
</style>
</head>
<body>
  <div class="stmt">Move upward<span class="dot-lg"></span></div>
  <ul class="bul">
    <li><span class="d"></span> Clear</li>
    <li><span class="d"></span> Confident</li>
    <li><span class="d"></span> Optimistic</li>
  </ul>
</body>
</html>
