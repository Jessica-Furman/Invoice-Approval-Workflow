<!-- @dsCard group="Spacing" viewport="700x150" name="Spacing scale" subtitle="4px base. Neutrals carry the breathing room." -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 24px; background: var(--surface-card); font-family: var(--font-body); }
  .row { display: flex; align-items: flex-end; gap: 14px; }
  .u { text-align: center; }
  .bar { background: var(--up-green); border-radius: var(--radius-xs); }
  .n { font-size: 11px; color: var(--text-muted); margin-top: 6px; }
</style>
</head>
<body>
  <div class="row">
    <div class="u"><div class="bar" style="width:4px;height:4px"></div><div class="n">4</div></div>
    <div class="u"><div class="bar" style="width:8px;height:8px"></div><div class="n">8</div></div>
    <div class="u"><div class="bar" style="width:12px;height:12px"></div><div class="n">12</div></div>
    <div class="u"><div class="bar" style="width:16px;height:16px"></div><div class="n">16</div></div>
    <div class="u"><div class="bar" style="width:24px;height:24px"></div><div class="n">24</div></div>
    <div class="u"><div class="bar" style="width:32px;height:32px"></div><div class="n">32</div></div>
    <div class="u"><div class="bar" style="width:48px;height:48px"></div><div class="n">48</div></div>
    <div class="u"><div class="bar" style="width:64px;height:64px"></div><div class="n">64</div></div>
  </div>
</body>
</html>
