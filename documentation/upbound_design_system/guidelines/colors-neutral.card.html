<!-- @dsCard group="Colors" viewport="700x150" name="Neutrals" subtitle="The 30% — space and legibility." -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 20px; background: var(--surface-page); }
  .row { display: flex; gap: 14px; }
  .sw { flex: 1; border-radius: var(--radius-md); overflow: hidden; border: 1px solid var(--border-subtle); background: var(--surface-card); }
  .chip { height: 66px; }
  .meta { padding: 8px 12px; font-family: var(--font-body); }
  .name { font-size: 13px; font-weight: 600; color: var(--text-strong); }
  .hex { font-size: 12px; color: var(--text-muted); font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:#C3C2C5"></div><div class="meta"><div class="name">Cool Grey</div><div class="hex">#C3C2C5</div></div></div>
    <div class="sw"><div class="chip" style="background:#F4F4F5"></div><div class="meta"><div class="name">Off White</div><div class="hex">#F4F4F5</div></div></div>
    <div class="sw"><div class="chip" style="background:#FFFFFF"></div><div class="meta"><div class="name">White</div><div class="hex">#FFFFFF</div></div></div>
  </div>
</body>
</html>
