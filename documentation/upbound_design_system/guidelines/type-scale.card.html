<!-- @dsCard group="Type" viewport="700x220" name="Type scale" subtitle="One ramp, weight + size only." -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 22px 24px; background: var(--surface-card); font-family: var(--font-body); }
  .r { display: flex; align-items: baseline; gap: 16px; padding: 5px 0; border-bottom: 1px solid var(--border-subtle); }
  .r:last-child { border-bottom: 0; }
  .k { width: 96px; font-size: 11px; color: var(--text-muted); flex: none; }
  .v { font-family: var(--font-display); color: var(--text-strong); }
  .spec { margin-left: auto; font-size: 11px; color: var(--text-muted); }
</style>
</head>
<body>
  <div class="r"><span class="k">Display / H1</span><span class="v" style="font-size:34px;font-weight:700">Move upward</span><span class="spec">Bold · 56px</span></div>
  <div class="r"><span class="k">Heading / H2</span><span class="v" style="font-size:26px;font-weight:600">Section title</span><span class="spec">Semibold · 32px</span></div>
  <div class="r"><span class="k">Subhead / H3</span><span class="v" style="font-size:19px;font-weight:500">Supporting subhead</span><span class="spec">Medium · 22px</span></div>
  <div class="r"><span class="k">Body</span><span class="v" style="font-family:var(--font-body);font-size:16px;font-weight:400">Readable paragraph text</span><span class="spec">Inter Regular · 16px</span></div>
  <div class="r"><span class="k">Caption</span><span class="v" style="font-family:var(--font-body);font-size:12px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase">Tracked label</span><span class="spec">Inter Bold · 12px</span></div>
</body>
</html>
